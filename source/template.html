  #s { opacity: .8; min-height: 1.5em; }
  #k { opacity: .65; font-size: 13px; }
  body.r #o { opacity: 0; pointer-events: none; }
  body.e #o { cursor: default; }
  #i { position: fixed; left: 10px; top: 8px; font: 12px/1.4 ui-monospace, monospace; white-space: pre; color: #cfe; text-shadow: 0 1px 2px #000; pointer-events: none; }

<div id="o"><h1>RỪNG</h1><div id="s">Loading…</div><div id="k">Click to enter · WASD move · mouse look · Q/E down/up · Shift fast · 1–6 viewpoints · F fly-through · B benchmark · H stats · Esc release</div></div>
